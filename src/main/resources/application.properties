spring.application.name=Library-Management-System
server.port=9090
spring.profiles.active=local

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/library_management
spring.datasource.username=bookshop
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 5000
spring.mail.properties.mail.smtp.writetimeout = 5000


app.frontend.reset-url=http://localhost:5173/auth/reset-password?token=

stripe.api.key=${stripe.api.key}
stripe.publishable.key=${stripe.publishable.key}
stripe.callback.base-url=http://localhost:5173